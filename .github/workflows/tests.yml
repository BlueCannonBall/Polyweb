name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug
          - name: ASan and UBSan
            sanitizer: ASAN
          - name: TSan
            sanitizer: TSAN
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install OpenSSL development files
        run: sudo apt-get update && sudo apt-get install --yes libssl-dev

      - name: Build and run tests
        working-directory: tests
        env:
          CCACHE_DISABLE: "1"
          ASAN: ${{ matrix.sanitizer == 'ASAN' && '1' || '' }}
          TSAN: ${{ matrix.sanitizer == 'TSAN' && '1' || '' }}
          ASAN_OPTIONS: detect_leaks=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          make clean
          make MODE=debug
          ./polyweb-tests

  windows:
    name: Windows Debug
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install GNU Make and OpenSSL development files
        shell: pwsh
        run: |
          choco install make openssl --yes --no-progress
          $openssl = "C:\Program Files\OpenSSL-Win64"
          if (!(Test-Path "$openssl\include\openssl\err.h")) {
            throw "OpenSSL headers were not installed at $openssl\include"
          }
          $library = "$openssl\lib\VC\x64\MD"
          if (!(Test-Path "$library\libssl.lib") -or !(Test-Path "$library\libcrypto.lib")) {
            throw "OpenSSL libraries were not installed at $library"
          }
          "OPENSSL_INCLUDE_DIR=$openssl\include" >> $env:GITHUB_ENV
          "OPENSSL_LIBRARY_DIR=$library" >> $env:GITHUB_ENV
          "PATH=$openssl\bin;$env:PATH" >> $env:GITHUB_ENV

      - name: Build and run tests
        shell: bash
        working-directory: tests
        env:
          CCACHE_DISABLE: "1"
        run: |
          make clean
          make MODE=debug
          ./polyweb-tests.exe
